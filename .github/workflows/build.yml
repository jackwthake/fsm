name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Build
      run: |
        gcc -std=c99 -Wall -Wextra -pedantic test/main.c fsm.c

    - name: Verify binaries exist
      run: |
        ls -lh a.out
        file a.out

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: |
          a.out
        retention-days: 5